<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-card">
        <h2 class="fx-ember">Simple Calculator</h2>

        <div class="input-group">
            <label for="num1">First Number</label>
            <input type="number" id="num1" placeholder="e.g. 10" required>
        </div>

        <div class="input-group">
            <label for="operator">Operator</label>
            <select id="operator" required>
                <option value="" selected disabled>Choose operator</option>
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">×</option>
                <option value="/">÷</option>
                <option value="%">%</option>
            </select>
        </div>

        <div class="input-group">
            <label for="num2">Second Number</label>
            <input type="number" id="num2" placeholder="e.g. 5" required>
        </div>

        <button id="calc-btn" type="button">Calculate</button>

        <div class="result-box">
            <span>Result:</span>
            <h3 id="result-text">--</h3>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
